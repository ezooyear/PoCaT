services:
  postgres:
    image: postgres:16-alpine
    container_name: pocat-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp:
    build: .
    container_name: pocat-mcp
    command: ["python", "-m", "mcp_servers.postgres_mcp_server"]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      MCP_POSTGRES_URL: http://mcp:8000/mcp
      FASTMCP_HOST: 0.0.0.0
      FASTMCP_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    container_name: pocat-app
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.fileWatcherType=none"]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      MCP_POSTGRES_URL: http://mcp:8000/mcp
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: none
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      mcp:
        condition: service_started

volumes:
  postgres_data:
