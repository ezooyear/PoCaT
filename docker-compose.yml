services:
  postgres:
    image: postgres:16-alpine
    container_name: pocat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-mcp:
    build: .
    container_name: pocat-postgres-mcp
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
    command: ["python", "-m", "mcp_servers.postgres_mcp_server"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    container_name: pocat-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      USE_MCP_DB: ${USE_MCP_DB:-true}
      MCP_POSTGRES_URL: http://postgres-mcp:8000/mcp
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-mcp:
        condition: service_started

volumes:
  postgres_data:
